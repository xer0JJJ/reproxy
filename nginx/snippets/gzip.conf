gzip on;
gzip_comp_level 5;
gzip_min_length 256;

gzip_vary on;
gzip_proxied any;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/xhtml+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml;
